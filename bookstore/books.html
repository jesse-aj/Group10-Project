<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books | PageTurner Books</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
     <nav>
        <div class="container">

         <!-- Logo / Site name -->
    <a href="index.html" class="nav-logo">PageTurner Books</a>


     <!-- Navigation links -->
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="books.html">Books</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>


    <!-- Right side: dark mode toggle + cart -->
    <div class="nav-right">

      <!-- Dark mode button -->
      <button class="btn-icon" id="darkmode-toggle">🌙</button>

      <!-- Cart icon with item count badge -->
      <a href="#cart" class="cart-icon">
        🛒

        <!-- This span will show how many items are in the cart -->
        <!-- cart.js will update this number automatically -->
        <span class="cart-count" id="cart-count">0</span>
      </a>



        </div>
    </nav>

    <!-- CART SIDEBAR - hidden by default, slides in when cart icon is clicked -->
<div class="cart-overlay" id="cart-overlay"></div>

<div class="cart-sidebar" id="cart-sidebar">

  <div class="cart-header">
    <h3>Your Cart</h3>
    <!-- Close button -->
    <button class="cart-close" id="cart-close">✕</button>
  </div>

  <!-- Cart items will be injected here by cart.js -->
  <div class="cart-items" id="cart-items"></div>

  <!-- Cart footer with total and checkout button -->
  <div class="cart-footer">
    <p class="cart-total">Total: <span id="cart-total">GHS 0</span></p>
    <button class="btn btn-primary" onclick="checkout()">
      Order via WhatsApp
    </button>
  </div>

</div>


    

    <!-- BOOKS PAGE MAIN CONTENT -->
<main>
  <section class="books-page">
    <div class="container">

      <!-- Page heading -->
      <h1>All Books</h1>
      <p>Browse our full collection. Click enquire on any book to order via WhatsApp.</p>

      <!-- SEARCH AND FILTER BAR -->
      <div class="books-controls">

        <!-- Search input -->
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search by title or author..."
          class="search-input"
        />

        <!-- Category filter buttons -->
        <div class="filter-buttons">
          <!-- data-category is how our JS knows which category to filter -->
          <button class="filter-btn active" data-category="all">All</button>
          <button class="filter-btn" data-category="self-help">Self Help</button>
          <button class="filter-btn" data-category="christian">Christian</button>
          <button class="filter-btn" data-category="fiction">Fiction</button>
          <button class="filter-btn" data-category="academic">Academic</button>
        </div>

      </div>

      <!-- Book cards will be injected here by books.js -->
      <div class="book-grid" id="books-container"></div>

    </div>
  </section>
</main>







<script src="js/books-data.js"></script>
<script src="js/books.js"></script>

<script src="js/darkmode.js"></script>
<script src="js/cart.js"></script> 
</body>
</html>
