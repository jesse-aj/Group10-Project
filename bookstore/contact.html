<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | PageTurner </title>
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
     <nav>
        <div class="container">

         <!-- Logo / Site name -->
    <a href="index.html" class="nav-logo">PageTurner Books</a>


     <!-- Navigation links -->
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="books.html">Books</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>



    <!-- Right side: dark mode toggle + cart -->
    <div class="nav-right">

      <!-- Dark mode button -->
      <button class="btn-icon" id="darkmode-toggle">🌙</button>

      <!-- Cart icon with item count badge -->
      <a href="#cart" class="cart-icon">
        🛒
        <!-- This span will show how many items are in the cart -->
        <!-- cart.js will update this number automatically -->
        <span class="cart-count" id="cart-count">0</span>
      </a>

        </div>
    </nav>

        <!-- CART SIDEBAR - hidden by default, slides in when cart icon is clicked -->
<div class="cart-overlay" id="cart-overlay"></div>

<div class="cart-sidebar" id="cart-sidebar">

  <div class="cart-header">
    <h3>Your Cart</h3>
    <!-- Close button -->
    <button class="cart-close" id="cart-close">✕</button>
  </div>

  <!-- Cart items will be injected here by cart.js -->
  <div class="cart-items" id="cart-items"></div>

  <!-- Cart footer with total and checkout button -->
  <div class="cart-footer">
    <p class="cart-total">Total: <span id="cart-total">GHS 0</span></p>
    <button class="btn btn-primary" onclick="checkout()">
      Order via WhatsApp
    </button>
  </div>

</div>


<!-- CONTACT PAGE -->
<main>
  <section class="contact-page">
    <div class="container">

      <h1>Contact Us</h1>
      <p class="contact-intro">Have a question or want to make an order? Fill the form below and we will get back to you on WhatsApp.</p>

      <!-- Contact form -->
      <!-- We use div not form tag to avoid default browser behaviour -->
      <div class="contact-form">

        <!-- Name field -->
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" placeholder="e.g. Kwame Mensah" />
        </div>

        <!-- Email field -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="e.g. kwame@email.com" />
        </div>

        <!-- Phone field -->
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="e.g. 0244000000" />
        </div>

        <!-- Message field -->
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" placeholder="Tell us what book you are looking for or any question you have..."></textarea>
        </div>

        <!-- Submit button -->
        <button class="btn btn-primary" onclick="sendMessage()">
          Send via WhatsApp
        </button>

      </div>

    </div>
  </section>
</main>




<script src="js/contact.js"></script> 
<script src="js/darkmode.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
